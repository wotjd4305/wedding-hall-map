<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>서울·경기 웨딩홀 지도</title>
  <meta name="description" content="서울·경기권 웨딩홀을 지도에서 한눈에 — 체크·메모·가격 필터" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💍</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=11" />
</head>
<body>
  <div class="app">
    <aside class="panel" id="panel">
      <button class="sheet-handle" id="sheetHandle" aria-label="목록 펼치기/접기"><span></span></button>

      <header class="brand">
        <p class="eyebrow">Seoul · Gyeonggi · Ulsan</p>
        <h1>웨딩홀 지도</h1>
        <p class="sub"><span id="count">0</span>곳 · 체크 <span id="checked">0</span>곳 · <em id="syncState"></em></p>
        <div class="presence" id="presence" hidden></div>
        <button class="share-btn" id="shareBtn" hidden>🔗 공유 링크 복사</button>
      </header>

      <div class="controls">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="이름, 동네, 역, 메모 검색" autocomplete="off" />
        </div>

        <div class="seg" id="regionSeg"></div>

        <select class="area-select" id="areaSel"></select>

        <div class="chips" id="typeChips"></div>

        <button class="more-toggle" id="moreToggle">
          <span>내 체크 · 가격 · 정렬</span>
          <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>

        <div class="more" id="more" hidden>
          <div class="row-label">내 체크</div>
          <div class="chips" id="statusChips"></div>

          <div class="row-label">식대 (1인) <b id="priceVal">전체</b></div>
          <input type="range" id="price" min="3" max="20" step="0.5" value="20" />

          <div class="row-label">대관료 + 꽃 <b id="rentVal">전체</b></div>
          <input type="range" id="rent" min="0" max="2500" step="50" value="2500" />

          <div class="row-label">하객 수 <b id="guestVal">전체</b></div>
          <input type="range" id="guests" min="0" max="800" step="50" value="0" />

          <div class="row-label">주차 <b id="parkVal">전체</b></div>
          <input type="range" id="park" min="0" max="1000" step="50" value="0" />

          <div class="row-label">예약 가능 월 <b id="bookableVal">전체</b></div>
          <div class="month-filter">
            <input type="month" id="bookableFilter" />
            <button type="button" id="bookableFilterClear">초기화</button>
          </div>
          <label class="check"><input type="checkbox" id="onlyBookable" /> 예약 가능 월 입력한 곳만</label>

          <label class="check"><input type="checkbox" id="onlyMine" /> 직접 견적 입력한 곳만</label>

          <div class="row-label">정렬</div>
          <div class="seg seg-4" id="sortSeg">
            <button class="on" data-sort="default">기본</button>
            <button data-sort="near">가까운 순</button>
            <button data-sort="price">식대 ↑</button>
            <button data-sort="rent">대관+꽃 ↑</button>
          </div>

          <div class="backup">
            <button id="exportBtn">체크·메모 내보내기</button>
            <button id="importBtn">가져오기</button>
            <input type="file" id="importFile" accept="application/json" hidden />
          </div>
        </div>
      </div>

      <ul class="list" id="list"></ul>

      <footer class="foot">
        가격 출처: <a href="https://weddingmap.seungjun.dev/" target="_blank" rel="noopener">결혼할지도</a> (한국소비자원 참가격 · 아이웨딩·웨딩북·다이렉트 표기가, 2026-09 기준). 실제 견적은 업체에 확인하세요. 공유 링크를 받은 사람끼리 체크·메모가 실시간으로 같이 보여요.
      </footer>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div class="map-badge" id="mapBadge" hidden></div>
    </main>
  </div>

  <!-- ?v= 숫자는 css/js를 고칠 때마다 올릴 것 — 안 올리면 방문자 브라우저가 옛날 파일을 캐싱해서 변경이 안 보일 수 있음 -->
  <script src="js/config.js?v=11"></script>
  <script src="js/venues.js?v=11"></script>
  <script src="js/app.js?v=11"></script>
</body>
</html>
